name: Temporary external-session refactor
on:
  push:
    branches: [Draft]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Ensure external-session refactor is applied
        run: |
          if ! grep -q 'enum class ExternalExitAction' app/src/main/java/com/clipnest/ui/editor/EditorViewModel.kt; then
            python .github/temporary_external_session_refactor.py
          fi
      - name: Stabilize Robolectric test SDK
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/test/java/com/clipnest/IncomingDocumentUriResolverTest.kt')
          s = p.read_text()
          if 'import org.robolectric.annotation.Config' not in s:
              s = s.replace('import org.robolectric.RobolectricTestRunner\n', 'import org.robolectric.RobolectricTestRunner\nimport org.robolectric.annotation.Config\n')
          if '@Config(sdk = [35])' not in s:
              s = s.replace('@RunWith(RobolectricTestRunner::class)\n', '@RunWith(RobolectricTestRunner::class)\n@Config(sdk = [35])\n')
          p.write_text(s)
          PY
      - name: Restore debug signing key
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Run unit tests and assemble debug APK
        run: |
          if [ ! -f gradlew ]; then gradle wrapper; fi
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon
          ./gradlew assembleDebug --no-daemon
      - name: Remove temporary refactor tooling and commit
        run: |
          rm -f .github/temporary_external_session_refactor.py .github/workflows/temporary_external_session_refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/clipnest/ui/editor/EditorViewModel.kt app/src/main/java/com/clipnest/ui/editor/EditorScreen.kt app/src/main/java/com/clipnest/MainActivity.kt app/src/test/java/com/clipnest/IncomingDocumentUriResolverTest.kt .github/temporary_external_session_refactor.py .github/workflows/temporary_external_session_refactor.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize external document session lifecycle'
          git push
