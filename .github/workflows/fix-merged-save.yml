name: Fix merged save
on:
  push:
    branches: [Draft]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Draft
          fetch-depth: 0
      - run: python3 scripts/fix_merged_external_save.py
      - run: git diff --check
      - run: |
          rm -f scripts/fix_merged_external_save.py .github/workflows/fix-merged-save.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/clipnest/ui/editor/EditorViewModel.kt scripts/fix_merged_external_save.py .github/workflows/fix-merged-save.yml
          git commit -m "Handle merged external saves consistently"
          git push origin Draft
