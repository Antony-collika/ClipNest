name: Editor Startup Trace

on:
  push:
    branches:
      - fix/editor-viewport-restore-timing
  workflow_dispatch:

jobs:
  trace-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Wrapper if not present
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew

      - name: Generate debug keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Inject temporary editor trace
        run: |
          cat > app/src/main/java/com/clipnest/ui/editor/EditorStartupTrace.kt <<'EOF'
          package com.clipnest.ui.editor

          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.ContextWrapper
          import android.content.Intent
          import android.graphics.Typeface
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import android.app.Dialog
          import java.text.SimpleDateFormat
          import java.util.ArrayDeque
          import java.util.Date
          import java.util.Locale

          internal object EditorStartupTrace {
              private const val TAG = "ClipNest.EditorTrace"
              private const val MAX_LINES = 500
              private val lines = ArrayDeque<String>()

              @Synchronized
              fun log(view: NativeEditorView, event: String) {
                  val now = SimpleDateFormat("HH:mm:ss.SSS", Locale.US).format(Date())
                  val line = "$now  $event  scrollY=${view.scrollY} sel=${view.selectionStart}..${view.selectionEnd} len=${view.length()} size=${view.width}x${view.height} layout=${view.layout?.height ?: 0}"
                  lines.addLast(line)
                  while (lines.size > MAX_LINES) lines.removeFirst()
                  android.util.Log.d(TAG, line)
              }

              @Synchronized
              private fun text(): String = if (lines.isEmpty()) "No editor trace yet." else lines.joinToString("\n")

              @Synchronized
              fun clear() {
                  lines.clear()
              }

              internal fun showDialog(context: Context) {
                  val activity = activityFrom(context) ?: return
                  activity.runOnUiThread {
                      val dialog = Dialog(activity)
                      val root = LinearLayout(activity).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dp(activity, 20), dp(activity, 16), dp(activity, 20), dp(activity, 12))
                      }
                      val title = TextView(activity).apply {
                          text = "Editor diagnostic log"
                          textSize = 20f
                          setTypeface(typeface, Typeface.BOLD)
                          setPadding(0, 0, 0, dp(activity, 12))
                      }
                      val textView = TextView(activity).apply {
                          text = text()
                          textSize = 11f
                          typeface = Typeface.MONOSPACE
                          setTextIsSelectable(true)
                      }
                      val scroll = ScrollView(activity).apply {
                          addView(textView, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      root.addView(title, LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      root.addView(scroll, LinearLayout.LayoutParams.MATCH_PARENT, dp(activity, 420))
                      val buttons = LinearLayout(activity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = android.view.Gravity.END
                      }
                      fun button(label: String, action: () -> Unit) = TextView(activity).apply {
                          text = label
                          textSize = 14f
                          setPadding(dp(activity, 12), dp(activity, 12), dp(activity, 12), dp(activity, 12))
                          setOnClickListener { action() }
                      }
                      buttons.addView(button("Clear") { clear(); textView.text = text() })
                      buttons.addView(button("Copy") {
                          val clipboard = activity.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          clipboard.setPrimaryClip(ClipData.newPlainText("ClipNest editor log", text()))
                          Toast.makeText(activity, "Log copied", Toast.LENGTH_SHORT).show()
                      })
                      buttons.addView(button("Share / Save") {
                          val send = Intent(Intent.ACTION_SEND).apply {
                              type = "text/plain"
                              putExtra(Intent.EXTRA_SUBJECT, "ClipNest editor diagnostic log")
                              putExtra(Intent.EXTRA_TEXT, text())
                          }
                          activity.startActivity(Intent.createChooser(send, "Share editor log"))
                      })
                      buttons.addView(button("Close") { dialog.dismiss() })
                      root.addView(buttons, LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      dialog.setContentView(root)
                      dialog.window?.setLayout(dp(activity, 360), ViewGroup.LayoutParams.WRAP_CONTENT)
                      dialog.show()
                      dialog.window?.setLayout(dp(activity, 360), ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
              }

              private fun activityFrom(context: Context): Activity? {
                  var current: Context? = context
                  while (current is ContextWrapper) {
                      if (current is Activity) return current
                      current = current.baseContext
                  }
                  return current as? Activity
              }

              private fun dp(context: Context, value: Int): Int = (value * context.resources.displayMetrics.density).toInt()
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch_editor():
              p = Path('app/src/main/java/com/clipnest/ui/editor/NativeEditorView.kt')
              s = p.read_text()
              def once(old, new, label):
                  nonlocal s
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
                  s = s.replace(old, new, 1)
              once('        setCursorVisible(true)\n', '        setCursorVisible(true)\n        EditorStartupTrace.log(this, "init")\n', 'init')
              patterns = [
                  (r'(override fun onLayout\([^\n]+\) \{\n)', 'onLayout'),
                  (r'(override fun onWindowFocusChanged\([^\n]+\) \{\n)', 'onWindowFocusChanged'),
                  (r'(override fun onWindowVisibilityChanged\([^\n]+\) \{\n)', 'onWindowVisibilityChanged'),
                  (r'(override fun onDetachedFromWindow\(\) \{\n)', 'onDetachedFromWindow'),
                  (r'(override fun onSelectionChanged\([^\n]+\) \{\n)', 'onSelectionChanged'),
                  (r'(fun setEditorText\([^\n]+\) \{\n)', 'setEditorText enter'),
                  (r'(private fun restorePendingScrollIfReady\(\) \{\n)', 'restorePendingScrollIfReady'),
                  (r'(fun restoreIfCurrent\(\) \{\n)', 'restoreIfCurrent'),
              ]
              for pattern, event in patterns:
                  matches = list(re.finditer(pattern, s))
                  if len(matches) != 1:
                      raise SystemExit(f'{event}: expected exactly 1 match, found {len(matches)}')
                  pos = matches[0].end()
                  indent = '        ' if event != 'restoreIfCurrent' else '            '
                  s = s[:pos] + f'{indent}EditorStartupTrace.log(this, "{event}")\n' + s[pos:]
              once('        setText(value)\n', '        setText(value)\n        EditorStartupTrace.log(this, "afterSetText")\n', 'afterSetText')
              once('                setSelection(safeStart, safeEnd)\n', '                setSelection(safeStart, safeEnd)\n                EditorStartupTrace.log(this, "afterSetSelection")\n', 'afterSetSelection')
              p.write_text(s)

          def patch_settings():
              p = Path('app/src/main/java/com/clipnest/ui/settings/SettingsScreen.kt')
              s = p.read_text()
              import_line = 'import com.clipnest.ui.editor.EditorStartupTrace\n'
              if import_line not in s:
                  marker = 'import com.clipnest.data.local.AppLanguage\n'
                  if marker not in s:
                      raise SystemExit('Settings import marker not found')
                  s = s.replace(marker, marker + import_line, 1)
              marker = '        item {\n            SettingsSectionHeader(title = stringResource(com.clipnest.R.string.privacy_security), icon = Icons.Default.Security)'
              if marker not in s:
                  raise SystemExit('Settings privacy section marker not found')
              debug_item = '''        item {
            SettingsSectionHeader(title = "Debug / Diagnostics", icon = Icons.Default.Security)
            OutlinedCard(shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {
                Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                    Text("Editor startup trace", style = MaterialTheme.typography.bodyLarge.copy(fontWeight = FontWeight.Medium))
                    Text("Collect the editor lifecycle and scroll-position trace so we can diagnose the startup jump.", style = MaterialTheme.typography.bodySmall.copy(color = MaterialTheme.colorScheme.onSurfaceVariant))
                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                        TextButton(onClick = { EditorStartupTrace.clear() }) { Text("Clear") }
                        TextButton(onClick = { EditorStartupTrace.showDialog(context) }, modifier = Modifier.testTag("settings_editor_trace_button")) { Text("View Log") }
                    }
                }
            }
        }

'''
              if 'title = "Debug / Diagnostics"' not in s:
                  s = s.replace(marker, debug_item + marker, 1)
              p.write_text(s)

          patch_editor()
          patch_settings()
          PY

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload trace APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ClipNest-editor-startup-trace-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
