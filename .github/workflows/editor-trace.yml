name: Editor Startup Trace

on:
  push:
    branches:
      - fix/editor-viewport-restore-timing
  workflow_dispatch:

jobs:
  trace-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Wrapper if not present
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew

      - name: Generate debug keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Inject temporary editor trace
        run: |
          cat > app/src/main/java/com/clipnest/ui/editor/EditorStartupTrace.kt <<'EOF'
          package com.clipnest.ui.editor

          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.ContextWrapper
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import java.text.SimpleDateFormat
          import java.util.ArrayDeque
          import java.util.Date
          import java.util.Locale

          internal object EditorStartupTrace {
              private const val TAG = "ClipNest.EditorTrace"
              private const val MAX_LINES = 500
              private val lines = ArrayDeque<String>()
              private var overlayInstalled = false

              @Synchronized
              fun log(view: NativeEditorView, event: String) {
                  val now = SimpleDateFormat("HH:mm:ss.SSS", Locale.US).format(Date())
                  val line = "$now  $event  scrollY=${view.scrollY} sel=${view.selectionStart}..${view.selectionEnd} len=${view.length()} size=${view.width}x${view.height} layout=${view.layout?.height ?: 0}"
                  lines.addLast(line)
                  while (lines.size > MAX_LINES) lines.removeFirst()
                  android.util.Log.d(TAG, line)
                  installOverlay(view)
              }

              @Synchronized
              private fun text(): String = if (lines.isEmpty()) "No editor trace yet." else lines.joinToString("\n")

              private fun activityFrom(context: Context): Activity? {
                  var current: Context? = context
                  while (current is ContextWrapper) {
                      if (current is Activity) return current
                      current = current.baseContext
                  }
                  return current as? Activity
              }

              private fun installOverlay(view: NativeEditorView) {
                  if (overlayInstalled) return
                  val activity = activityFrom(view.context) ?: return
                  val decor = activity.window?.decorView as? ViewGroup ?: return
                  activity.runOnUiThread {
                      if (overlayInstalled) return@runOnUiThread
                      val button = Button(activity).apply {
                          text = "LOG"
                          textSize = 11f
                          setTextColor(Color.WHITE)
                          setBackgroundColor(Color.DKGRAY)
                          setPadding(10, 0, 10, 0)
                          contentDescription = "Open ClipNest editor diagnostic log"
                          setOnClickListener { showDialog(activity) }
                      }
                      val lp = ViewGroup.MarginLayoutParams(dp(activity, 58), dp(activity, 42)).apply {
                          topMargin = dp(activity, 6)
                          rightMargin = dp(activity, 6)
                      }
                      decor.addView(button, lp)
                      overlayInstalled = true
                  }
              }

              private fun showDialog(activity: Activity) {
                  val textView = TextView(activity).apply {
                      text = text()
                      textSize = 12f
                      typeface = Typeface.MONOSPACE
                      setTextIsSelectable(true)
                      setPadding(dp(activity, 12), dp(activity, 8), dp(activity, 12), dp(activity, 8))
                  }
                  val scroll = ScrollView(activity).apply {
                      addView(textView, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
                  val container = LinearLayout(activity).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(scroll, LinearLayout.LayoutParams.MATCH_PARENT, dp(activity, 420))
                  }
                  val dialog = AlertDialog.Builder(activity)
                      .setTitle("Editor diagnostic log")
                      .setView(container)
                      .setNegativeButton("Close", null)
                      .setNeutralButton("Share / Save", null)
                      .setPositiveButton("Copy", null)
                      .create()
                  dialog.setOnShowListener {
                      dialog.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener {
                          val clipboard = activity.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          clipboard.setPrimaryClip(ClipData.newPlainText("ClipNest editor log", text()))
                          Toast.makeText(activity, "Log copied", Toast.LENGTH_SHORT).show()
                      }
                      dialog.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener {
                          val send = Intent(Intent.ACTION_SEND).apply {
                              type = "text/plain"
                              putExtra(Intent.EXTRA_SUBJECT, "ClipNest editor diagnostic log")
                              putExtra(Intent.EXTRA_TEXT, text())
                          }
                          activity.startActivity(Intent.createChooser(send, "Share editor log"))
                      }
                  }
                  dialog.show()
              }

              private fun dp(context: Context, value: Int): Int = (value * context.resources.displayMetrics.density).toInt()
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/clipnest/ui/editor/NativeEditorView.kt')
          s_ref = [p.read_text()]

          def once(old, new, label):
              count = s_ref[0].count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s_ref[0] = s_ref[0].replace(old, new, 1)

          once('        setCursorVisible(true)\n', '        setCursorVisible(true)\n        EditorStartupTrace.log(this, "init")\n', 'init')

          patterns = [
              (r'(override fun onLayout\([^\n]+\) \{\n)', 'onLayout'),
              (r'(override fun onWindowFocusChanged\([^\n]+\) \{\n)', 'onWindowFocusChanged'),
              (r'(override fun onWindowVisibilityChanged\([^\n]+\) \{\n)', 'onWindowVisibilityChanged'),
              (r'(override fun onDetachedFromWindow\(\) \{\n)', 'onDetachedFromWindow'),
              (r'(override fun onSelectionChanged\([^\n]+\) \{\n)', 'onSelectionChanged'),
              (r'(fun setEditorText\([^\n]+\) \{\n)', 'setEditorText enter'),
              (r'(private fun restorePendingScrollIfReady\(\) \{\n)', 'restorePendingScrollIfReady'),
              (r'(fun restoreIfCurrent\(\) \{\n)', 'restoreIfCurrent'),
          ]

          for pattern, event in patterns:
              matches = list(re.finditer(pattern, s_ref[0]))
              if len(matches) != 1:
                  raise SystemExit(f'{event}: expected exactly 1 match, found {len(matches)}')
              pos = matches[0].end()
              indent = '        ' if event != 'restoreIfCurrent' else '            '
              text = s_ref[0]
              s_ref[0] = text[:pos] + f'{indent}EditorStartupTrace.log(this, "{event}")\n' + text[pos:]

          once('        setText(value)\n', '        setText(value)\n        EditorStartupTrace.log(this, "afterSetText")\n', 'afterSetText')
          once('                setSelection(safeStart, safeEnd)\n', '                setSelection(safeStart, safeEnd)\n                EditorStartupTrace.log(this, "afterSetSelection")\n', 'afterSetSelection')

          p.write_text(s_ref[0])
          PY

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload trace APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ClipNest-editor-startup-trace-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
