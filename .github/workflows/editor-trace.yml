name: Editor Startup Trace

on:
  push:
    branches:
      - fix/editor-viewport-restore-timing
  workflow_dispatch:

jobs:
  trace-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Wrapper if not present
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew

      - name: Generate debug keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Inject temporary editor trace
        run: |
          cat > app/src/main/java/com/clipnest/ui/editor/EditorStartupTrace.kt <<'EOF'
          package com.clipnest.ui.editor

          import java.text.SimpleDateFormat
          import java.util.ArrayDeque
          import java.util.Date
          import java.util.Locale

          internal object EditorStartupTrace {
              private const val TAG = "ClipNest.EditorTrace"
              private const val MAX_LINES = 500
              private val lines = ArrayDeque<String>()

              @Synchronized
              fun log(view: NativeEditorView, event: String) {
                  val now = SimpleDateFormat("HH:mm:ss.SSS", Locale.US).format(Date())
                  val line = "$now  $event  scrollY=${view.scrollY} sel=${view.selectionStart}..${view.selectionEnd} len=${view.length()} size=${view.width}x${view.height} layout=${view.layout?.height ?: 0}"
                  lines.addLast(line)
                  while (lines.size > MAX_LINES) lines.removeFirst()
                  android.util.Log.d(TAG, line)
              }

              @Synchronized
              fun snapshot(): String = if (lines.isEmpty()) "No editor trace yet." else lines.joinToString("\n")

              @Synchronized
              fun clear() {
                  lines.clear()
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch_editor():
              p = Path('app/src/main/java/com/clipnest/ui/editor/NativeEditorView.kt')
              s = p.read_text()

              def once(old, new, label):
                  nonlocal s
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
                  s = s.replace(old, new, 1)

              once('        setCursorVisible(true)\n', '        setCursorVisible(true)\n        EditorStartupTrace.log(this, "init")\n', 'init')

              patterns = [
                  (r'(override fun onLayout\([^\n]+\) \{\n)', 'onLayout'),
                  (r'(override fun onWindowFocusChanged\([^\n]+\) \{\n)', 'onWindowFocusChanged'),
                  (r'(override fun onWindowVisibilityChanged\([^\n]+\) \{\n)', 'onWindowVisibilityChanged'),
                  (r'(override fun onDetachedFromWindow\(\) \{\n)', 'onDetachedFromWindow'),
                  (r'(override fun onSelectionChanged\([^\n]+\) \{\n)', 'onSelectionChanged'),
                  (r'(fun setEditorText\([^\n]+\) \{\n)', 'setEditorText enter'),
                  (r'(private fun restorePendingScrollIfReady\(\) \{\n)', 'restorePendingScrollIfReady'),
                  (r'(fun restoreIfCurrent\(\) \{\n)', 'restoreIfCurrent'),
              ]

              for pattern, event in patterns:
                  matches = list(re.finditer(pattern, s))
                  if len(matches) != 1:
                      raise SystemExit(f'{event}: expected exactly 1 match, found {len(matches)}')
                  pos = matches[0].end()
                  indent = '        ' if event != 'restoreIfCurrent' else '            '
                  s = s[:pos] + f'{indent}EditorStartupTrace.log(this, "{event}")\n' + s[pos:]

              once('        setText(value)\n', '        setText(value)\n        EditorStartupTrace.log(this, "afterSetText")\n', 'afterSetText')
              once('                setSelection(safeStart, safeEnd)\n', '                setSelection(safeStart, safeEnd)\n                EditorStartupTrace.log(this, "afterSetSelection")\n', 'afterSetSelection')
              p.write_text(s)

          def patch_settings():
              p = Path('app/src/main/java/com/clipnest/ui/settings/SettingsScreen.kt')
              s = p.read_text()

              imports = [
                  'import android.content.ClipData\n',
                  'import android.content.ClipboardManager\n',
                  'import android.content.Intent\n',
                  'import androidx.compose.foundation.text.selection.SelectionContainer\n',
                  'import androidx.compose.material3.AlertDialog\n',
                  'import androidx.compose.ui.text.font.FontFamily\n',
                  'import com.clipnest.ui.editor.EditorStartupTrace\n',
              ]
              marker = 'import android.content.Context\n'
              for imp in imports[:3]:
                  if imp not in s:
                      s = s.replace(marker, marker + imp, 1)
                      marker = imp
              for imp in imports[3:5]:
                  if imp not in s:
                      anchor = 'import androidx.compose.foundation.text.selection.SelectionContainer\n' if imp.startswith('import androidx.compose.material3') else 'import androidx.compose.foundation.rememberScrollState\n'
                      if anchor not in s:
                          raise SystemExit(f'import anchor not found for {imp.strip()}')
                      s = s.replace(anchor, anchor + imp, 1)
              if imports[5] not in s:
                  anchor = 'import androidx.compose.ui.text.font.FontWeight\n'
                  s = s.replace(anchor, anchor + imports[5], 1)
              if imports[6] not in s:
                  anchor = 'import com.clipnest.data.local.AppLanguage\n'
                  s = s.replace(anchor, anchor + imports[6], 1)

              state_marker = '    var promptInput by remember { mutableStateOf("") }\n'
              state_add = state_marker + '    var showTraceDialog by remember { mutableStateOf(false) }\n    var traceVersion by remember { mutableStateOf(0) }\n'
              if 'var showTraceDialog by remember' not in s:
                  if state_marker not in s:
                      raise SystemExit('Settings state marker not found')
                  s = s.replace(state_marker, state_add, 1)

              section_marker = '''        item {
            SettingsSectionHeader(title = stringResource(com.clipnest.R.string.privacy_security), icon = Icons.Default.Security)'''
              if section_marker not in s:
                  raise SystemExit('Settings privacy section marker not found')

              debug_item = '''        item {
            SettingsSectionHeader(title = "Debug / Diagnostics", icon = Icons.Default.Security)
            OutlinedCard(shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {
                Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                    Text("Editor startup trace", style = MaterialTheme.typography.bodyLarge.copy(fontWeight = FontWeight.Medium))
                    Text("Collect the editor lifecycle and scroll-position trace so we can diagnose the startup jump.", style = MaterialTheme.typography.bodySmall.copy(color = MaterialTheme.colorScheme.onSurfaceVariant))
                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                        TextButton(onClick = { EditorStartupTrace.clear(); traceVersion++ }) { Text("Clear") }
                        TextButton(onClick = { showTraceDialog = true }, modifier = Modifier.testTag("settings_editor_trace_button")) { Text("View Log") }
                    }
                }
            }
        }

'''
              if 'title = "Debug / Diagnostics"' not in s:
                  s = s.replace(section_marker, debug_item + section_marker, 1)

              dialog_marker = '''    LazyColumn(
        modifier = modifier.fillMaxSize().padding(horizontal = 16.dp, vertical = 12.dp),'''
              if dialog_marker not in s:
                  raise SystemExit('LazyColumn marker not found')

              dialog_code = '''    if (showTraceDialog) {
        val traceText = remember(traceVersion, showTraceDialog) { EditorStartupTrace.snapshot() }
        AlertDialog(
            onDismissRequest = { showTraceDialog = false },
            title = { Text("Editor diagnostic log") },
            text = {
                SelectionContainer {
                    Box(modifier = Modifier.fillMaxWidth().height(420.dp)) {
                        androidx.compose.foundation.verticalScroll(rememberScrollState()).let { scroll ->
                            Text(traceText, fontFamily = FontFamily.Monospace, fontSize = 11.sp, modifier = Modifier.fillMaxWidth().then(Modifier.verticalScroll(scroll)))
                        }
                    }
                }
            },
            confirmButton = {
                TextButton(onClick = {
                    val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                    clipboard.setPrimaryClip(ClipData.newPlainText("ClipNest editor log", traceText))
                    Toast.makeText(context, "Log copied", Toast.LENGTH_SHORT).show()
                }) { Text("Copy") }
            },
            dismissButton = {
                Row {
                    TextButton(onClick = {
                        val send = Intent(Intent.ACTION_SEND).apply {
                            type = "text/plain"
                            putExtra(Intent.EXTRA_SUBJECT, "ClipNest editor diagnostic log")
                            putExtra(Intent.EXTRA_TEXT, traceText)
                        }
                        context.startActivity(Intent.createChooser(send, "Share editor log"))
                    }) { Text("Share / Save") }
                    TextButton(onClick = { showTraceDialog = false }) { Text("Close") }
                }
            }
        )
    }

'''
              if 'title = { Text("Editor diagnostic log") }' not in s:
                  s = s.replace(dialog_marker, dialog_marker + dialog_code, 1)
              p.write_text(s)

          patch_editor()
          patch_settings()
          PY

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload trace APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ClipNest-editor-startup-trace-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
