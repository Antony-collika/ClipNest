name: Editor Startup Trace

on:
  push:
    branches:
      - fix/editor-viewport-restore-timing
  workflow_dispatch:

jobs:
  trace-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Wrapper if not present
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew

      - name: Generate debug keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Inject temporary editor trace
        run: |
          cat > app/src/main/java/com/clipnest/ui/editor/EditorStartupTrace.kt <<'EOF'
          package com.clipnest.ui.editor

          import android.util.Log

          internal object EditorStartupTrace {
              private const val TAG = "ClipNest.EditorTrace"

              fun log(view: NativeEditorView, event: String) {
                  Log.d(
                      TAG,
                      "$event scrollY=${view.scrollY} sel=${view.selectionStart}..${view.selectionEnd} " +
                          "len=${view.length()} size=${view.width}x${view.height} layout=${view.layout?.height ?: 0}"
                  )
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/clipnest/ui/editor/NativeEditorView.kt')
          s = p.read_text()

          def once(old, new, label):
              nonlocal_s[0], count = nonlocal_s[0], nonlocal_s[0].count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              nonlocal_s[0] = nonlocal_s[0].replace(old, new, 1)

          nonlocal_s = [s]
          once(
              '        setCursorVisible(true)\n',
              '        setCursorVisible(true)\n        EditorStartupTrace.log(this, "init")\n',
              'init',
          )

          patterns = [
              (r'(override fun onLayout\([^\n]+\) \{\n)', 'onLayout'),
              (r'(override fun onWindowFocusChanged\([^\n]+\) \{\n)', 'onWindowFocusChanged'),
              (r'(override fun onWindowVisibilityChanged\([^\n]+\) \{\n)', 'onWindowVisibilityChanged'),
              (r'(override fun onDetachedFromWindow\(\) \{\n)', 'onDetachedFromWindow'),
              (r'(override fun onSelectionChanged\([^\n]+\) \{\n)', 'onSelectionChanged'),
              (r'(fun setEditorText\([^\n]+\) \{\n)', 'setEditorText enter'),
              (r'(private fun restorePendingScrollIfReady\(\) \{\n)', 'restorePendingScrollIfReady'),
              (r'(fun restoreIfCurrent\(\) \{\n)', 'restoreIfCurrent'),
          ]

          for pattern, event in patterns:
              m = list(re.finditer(pattern, nonlocal_s[0]))
              if len(m) != 1:
                  raise SystemExit(f'{event}: expected exactly 1 match, found {len(m)}')
              pos = m[0].end()
              indent = '        ' if event != 'restoreIfCurrent' else '            '
              text = nonlocal_s[0]
              nonlocal_s[0] = text[:pos] + f'{indent}EditorStartupTrace.log(this, "{event}")\n' + text[pos:]

          once(
              '        setText(value)\n',
              '        setText(value)\n        EditorStartupTrace.log(this, "afterSetText")\n',
              'afterSetText',
          )

          once(
              '                setSelection(safeStart, safeEnd)\n',
              '                setSelection(safeStart, safeEnd)\n                EditorStartupTrace.log(this, "afterSetSelection")\n',
              'afterSetSelection',
          )

          p.write_text(nonlocal_s[0])
          PY

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload trace APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ClipNest-editor-startup-trace-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
