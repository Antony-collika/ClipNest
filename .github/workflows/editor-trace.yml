name: Editor Startup Trace

on: [push, workflow_dispatch]

jobs:
  trace-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare build
        shell: bash
        run: |
          if [ ! -f gradlew ]; then gradle wrapper; fi
          chmod +x gradlew
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
      - name: Inject editor trace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          trace = '''package com.clipnest.ui.editor

          import android.app.Activity
          import android.app.Dialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.ContextWrapper
          import android.content.Intent
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.text.SimpleDateFormat
          import java.util.ArrayDeque
          import java.util.Date
          import java.util.Locale

          internal object EditorStartupTrace {
              private const val TAG = "ClipNest.EditorTrace"
              private const val MAX_LINES = 500
              private val lines = ArrayDeque<String>()

              @Synchronized
              fun log(view: NativeEditorView, event: String) {
                  val now = SimpleDateFormat("HH:mm:ss.SSS", Locale.US).format(Date())
                  val line = "$now  $event  scrollY=${view.scrollY} sel=${view.selectionStart}..${view.selectionEnd} len=${view.length()} size=${view.width}x${view.height} layout=${view.layout?.height ?: 0}"
                  lines.addLast(line)
                  while (lines.size > MAX_LINES) lines.removeFirst()
                  android.util.Log.d(TAG, line)
              }

              @Synchronized private fun text(): String = if (lines.isEmpty()) "No editor trace yet." else lines.joinToString("\\n")
              @Synchronized fun clear() { lines.clear() }

              internal fun showDialog(context: Context) {
                  val activity = activityFrom(context) ?: return
                  activity.runOnUiThread {
                      val dialog = Dialog(activity)
                      val root = LinearLayout(activity).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dp(activity, 20), dp(activity, 16), dp(activity, 20), dp(activity, 12))
                      }
                      root.addView(TextView(activity).apply {
                          text = "Editor diagnostic log"
                          textSize = 20f
                          setTypeface(typeface, Typeface.BOLD)
                          setPadding(0, 0, 0, dp(activity, 12))
                      })
                      val logView = TextView(activity).apply {
                          text = text()
                          textSize = 11f
                          typeface = Typeface.MONOSPACE
                          setTextIsSelectable(true)
                      }
                      root.addView(ScrollView(activity).apply {
                          addView(logView, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }, LinearLayout.LayoutParams.MATCH_PARENT, dp(activity, 420))
                      val buttons = LinearLayout(activity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.END
                      }
                      fun addButton(label: String, action: () -> Unit) {
                          buttons.addView(TextView(activity).apply {
                              text = label
                              textSize = 14f
                              setPadding(dp(activity, 10), dp(activity, 12), dp(activity, 10), dp(activity, 12))
                              setOnClickListener { action() }
                          })
                      }
                      addButton("Clear") { clear(); logView.text = text() }
                      addButton("Copy") {
                          val cm = activity.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("ClipNest editor log", text()))
                          Toast.makeText(activity, "Log copied", Toast.LENGTH_SHORT).show()
                      }
                      addButton("Share") {
                          val send = Intent(Intent.ACTION_SEND).apply {
                              type = "text/plain"
                              putExtra(Intent.EXTRA_SUBJECT, "ClipNest editor diagnostic log")
                              putExtra(Intent.EXTRA_TEXT, text())
                          }
                          activity.startActivity(Intent.createChooser(send, "Share editor log"))
                      }
                      addButton("Close") { dialog.dismiss() }
                      root.addView(buttons)
                      dialog.setContentView(root)
                      dialog.show()
                      dialog.window?.setLayout(dp(activity, 360), ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
              }

              private fun activityFrom(context: Context): Activity? {
                  var c: Context? = context
                  while (c is ContextWrapper) {
                      if (c is Activity) return c
                      c = c.baseContext
                  }
                  return c as? Activity
              }
              private fun dp(context: Context, value: Int): Int = (value * context.resources.displayMetrics.density).toInt()
          }
          '''
          trace_path = Path('app/src/main/java/com/clipnest/ui/editor/EditorStartupTrace.kt')
          trace_path.write_text(trace)

          p = Path('app/src/main/java/com/clipnest/ui/editor/NativeEditorView.kt')
          s = p.read_text()
          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              s = s.replace(old, new, 1)
          one('        setCursorVisible(true)\n', '        setCursorVisible(true)\n        EditorStartupTrace.log(this, "init")\n', 'init')
          for pattern, event, indent in [
              (r'(override fun onLayout\([^\n]+\) \{\n)', 'onLayout', '        '),
              (r'(override fun onWindowFocusChanged\([^\n]+\) \{\n)', 'onWindowFocusChanged', '        '),
              (r'(override fun onWindowVisibilityChanged\([^\n]+\) \{\n)', 'onWindowVisibilityChanged', '        '),
              (r'(override fun onDetachedFromWindow\(\) \{\n)', 'onDetachedFromWindow', '        '),
              (r'(override fun onSelectionChanged\([^\n]+\) \{\n)', 'onSelectionChanged', '        '),
              (r'(fun setEditorText\([^\n]+\) \{\n)', 'setEditorText enter', '        '),
              (r'(private fun restorePendingScrollIfReady\(\) \{\n)', 'restorePendingScrollIfReady', '        '),
              (r'(fun restoreIfCurrent\(\) \{\n)', 'restoreIfCurrent', '            '),
          ]:
              m = list(re.finditer(pattern, s))
              if len(m) != 1:
                  raise SystemExit(f'{event}: expected 1 match, found {len(m)}')
              i = m[0].end()
              s = s[:i] + f'{indent}EditorStartupTrace.log(this, "{event}")\n' + s[i:]
          one('        setText(value)\n', '        setText(value)\n        EditorStartupTrace.log(this, "afterSetText")\n', 'afterSetText')
          one('                setSelection(safeStart, safeEnd)\n', '                setSelection(safeStart, safeEnd)\n                EditorStartupTrace.log(this, "afterSetSelection")\n', 'afterSetSelection')
          p.write_text(s)

          p = Path('app/src/main/java/com/clipnest/ui/settings/SettingsScreen.kt')
          s = p.read_text()
          imp = 'import com.clipnest.ui.editor.EditorStartupTrace\n'
          if imp not in s:
              marker = 'import com.clipnest.data.local.AppLanguage\n'
              if marker not in s:
                  raise SystemExit('settings import marker missing')
              s = s.replace(marker, marker + imp, 1)
          marker = '        item {\n            SettingsSectionHeader(title = stringResource(com.clipnest.R.string.privacy_security), icon = Icons.Default.Security)'
          if marker not in s:
              raise SystemExit('settings section marker missing')
          if 'title = "Debug / Diagnostics"' not in s:
              block = '''        item {
            SettingsSectionHeader(title = "Debug / Diagnostics", icon = Icons.Default.Security)
            OutlinedCard(shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {
                Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                    Text("Editor startup trace", style = MaterialTheme.typography.bodyLarge.copy(fontWeight = FontWeight.Medium))
                    Text("Collect editor lifecycle and scroll-position events for startup-jump diagnosis.", style = MaterialTheme.typography.bodySmall.copy(color = MaterialTheme.colorScheme.onSurfaceVariant))
                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                        TextButton(onClick = { EditorStartupTrace.clear() }) { Text("Clear") }
                        TextButton(onClick = { EditorStartupTrace.showDialog(context) }, modifier = Modifier.testTag("settings_editor_trace_button")) { Text("View Log") }
                    }
                }
            }
        }

'''
              s = s.replace(marker, block + marker, 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload trace APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipNest-editor-startup-trace-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
