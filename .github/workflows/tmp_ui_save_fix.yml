name: Temporary UI save fix

on:
  push:
    branches: [Draft]

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix external save UI and .cne output'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Draft
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fm = Path('app/src/main/java/com/clipnest/data/local/FileManager.kt')
          s = fm.read_text()
          s = s.replace('val mimeType = if (encrypted) "application/json" else format.mimeType', 'val mimeType = if (encrypted) "application/octet-stream" else format.mimeType')
          s = s.replace('val extension = if (format.isEncrypted) ".json" else format.extension', 'val extension = if (format.isEncrypted) ".cne" else format.extension')
          fm.write_text(s)

          vm = Path('app/src/main/java/com/clipnest/ui/editor/EditorViewModel.kt')
          s = vm.read_text()
          old = '''    private fun saveToFolder(resolver: ContentResolver, folder: Uri, fileName: String, format: ExportFormat) { val text = currentDocumentText(); val revision = _uiState.value.documentRevision; viewModelScope.launch(Dispatchers.IO) { val saved = runCatching { fileManager.saveNewFileToTree(resolver, folder, fileName, format, text) }.getOrNull(); withContext(Dispatchers.Main.immediate) { if (saved == null) emitToast(com.clipnest.R.string.could_not_save_file) else { _uiState.value = _uiState.value.copy(showSaveNewFileDialog = false, isDirty = if (_uiState.value.documentRevision == revision) false else _uiState.value.isDirty, lastSavedTimestamp = if (_uiState.value.documentRevision == revision) System.currentTimeMillis() else _uiState.value.lastSavedTimestamp); emitToast(com.clipnest.R.string.saved_file, fileName, format.extension) } } } }'''
          new = '''    private fun saveToFolder(resolver: ContentResolver, folder: Uri, fileName: String, format: ExportFormat) { val text = currentDocumentText(); val revision = _uiState.value.documentRevision; val savedExtension = if (format.isEncrypted) ".cne" else format.extension; viewModelScope.launch(Dispatchers.IO) { val saved = runCatching { fileManager.saveNewFileToTree(resolver, folder, fileName, format, text) }.getOrNull(); withContext(Dispatchers.Main.immediate) { if (saved == null) emitToast(com.clipnest.R.string.could_not_save_file) else { _uiState.value = _uiState.value.copy(showSaveNewFileDialog = false, isDirty = if (_uiState.value.documentRevision == revision) false else _uiState.value.isDirty, lastSavedTimestamp = if (_uiState.value.documentRevision == revision) System.currentTimeMillis() else _uiState.value.lastSavedTimestamp); emitToast(com.clipnest.R.string.saved_file, fileName, savedExtension) } } } }'''
          if old not in s:
              raise SystemExit('EditorViewModel saveToFolder block not found')
          vm.write_text(s.replace(old, new))

          screen = Path('app/src/main/java/com/clipnest/ui/editor/EditorScreen.kt')
          s = screen.read_text()
          old = '''        AlertDialog(\n            onDismissRequest = viewModel::cancelExternalExit,\n            title = { Text("Unsaved changes") },\n            text = { Text("This external file has unsaved changes. What would you like to do?") },\n            confirmButton = {\n                TextButton(onClick = { viewModel.chooseExternalSave(context.contentResolver) }) { Text("Save file") }\n            },\n            dismissButton = {\n                Row {\n                    TextButton(onClick = viewModel::chooseExternalSaveAs) { Text("Save as") }\n                    TextButton(onClick = { viewModel.chooseExternalNoSave(context.contentResolver) }) { Text("No save") }\n                    TextButton(onClick = viewModel::cancelExternalExit) { Text("Cancel") }\n                }\n            }\n        )'''
          new = '''        AlertDialog(\n            onDismissRequest = viewModel::cancelExternalExit,\n            title = { Text("Unsaved changes") },\n            text = { Text("This external file has unsaved changes. What would you like to do?") },\n            confirmButton = {\n                Column(horizontalAlignment = Alignment.End) {\n                    Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {\n                        TextButton(onClick = { viewModel.chooseExternalSave(context.contentResolver) }) { Text("Save") }\n                        TextButton(onClick = viewModel::chooseExternalSaveAs) { Text("Save as") }\n                        TextButton(onClick = { viewModel.chooseExternalNoSave(context.contentResolver) }) { Text("Don't save") }\n                    }\n                    TextButton(onClick = viewModel::cancelExternalExit) { Text("Cancel") }\n                }\n            },\n            dismissButton = {}\n        )'''
          if old not in s:
              raise SystemExit('EditorScreen unsaved dialog block not found')
          screen.write_text(s.replace(old, new))
          PY

      - name: Run unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/tmp_ui_save_fix.yml
          git add app/src/main/java/com/clipnest/data/local/FileManager.kt app/src/main/java/com/clipnest/ui/editor/EditorViewModel.kt app/src/main/java/com/clipnest/ui/editor/EditorScreen.kt .github/workflows/tmp_ui_save_fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix external save UI and .cne output'
          git push origin Draft
