name: Clean Old Artifacts

on:
  workflow_dispatch:
    inputs:
      keep_days:
        description: 'Keep artifacts created within this many days'
        required: false
        default: '2'
        type: string
  schedule:
    - cron: '30 0 * * *'

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete artifacts older than 2 days
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_DAYS: ${{ inputs.keep_days || '2' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          cutoff="$(date -u -d "${KEEP_DAYS} days ago" +%s)"
          echo "Keeping artifacts created in the last ${KEEP_DAYS} days."
          echo "Cutoff: $(date -u -d "@${cutoff}" '+%Y-%m-%d %H:%M:%S UTC')"

          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPO}/actions/artifacts" \
            --jq '.artifacts[] | [.id, .name, .created_at] | @tsv' > /tmp/artifacts.tsv

          deleted=0
          kept=0

          while IFS=$'\t' read -r id name created_at; do
            [ -z "${id:-}" ] && continue
            created_ts="$(date -u -d "${created_at}" +%s)"

            if [ "${created_ts}" -lt "${cutoff}" ]; then
              echo "DELETE: ${id} | ${name} | ${created_at}"
              gh api --method DELETE \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${REPO}/actions/artifacts/${id}"
              deleted=$((deleted + 1))
            else
              echo "KEEP:   ${id} | ${name} | ${created_at}"
              kept=$((kept + 1))
            fi
          done < /tmp/artifacts.tsv

          echo ""
          echo "Cleanup complete: deleted=${deleted}, kept=${kept}"
