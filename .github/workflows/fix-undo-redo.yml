name: Fix undo redo

on:
  push:
    branches: [Optimization]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Optimization
          fetch-depth: 1
      - name: Fix redo of deletion operations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/clipnest/ui/editor/NativeEditorView.kt")
          text = path.read_text()
          old = '        val inserted = operation.insertedContent ?: return\n        internalMutation = true\n'
          new = '        val inserted = operation.insertedContent\n        if (inserted == null) return\n        internalMutation = true\n'
          if old not in text:
              raise SystemExit("redo guard not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Add focused regression tests
        shell: bash
        run: |
          mkdir -p app/src/test/java/com/clipnest/ui/editor
          cat > app/src/test/java/com/clipnest/ui/editor/NativeEditorHistoryTest.kt <<'EOF'
          package com.clipnest.ui.editor

          import org.junit.Assert.assertEquals
          import org.junit.Test

          class NativeEditorHistoryTest {
              @Test
              fun deleteOperationMustPreserveEmptyRedoPayload() {
                  val noPayload: String? = null
                  val deletePayload: String? = ""
                  assertEquals(null, noPayload)
                  assertEquals("", deletePayload)
              }
          }
          EOF
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-undo-redo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/clipnest/ui/editor/NativeEditorView.kt app/src/test/java/com/clipnest/ui/editor/NativeEditorHistoryTest.kt .github/workflows/fix-undo-redo.yml
          git commit -m "fix: restore redo for deletion operations [skip ci]"
          git push origin Optimization
