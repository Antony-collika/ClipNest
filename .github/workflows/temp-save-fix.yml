name: Temp save fix
on:
  push:
    branches: [Draft]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Draft
          fetch-depth: 0
      - name: Apply save semantics
        run: python3 scripts/apply_save_semantics_fix.py
      - name: Validate changes
        run: git diff --check
      - name: Remove temporary files and commit
        run: |
          rm -f scripts/apply_save_semantics_fix.py .github/workflows/adjust-save-semantics.yml .github/workflows/temp-save-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/clipnest/ui/editor/EditorViewModel.kt app/src/main/java/com/clipnest/ui/editor/SaveNewFileDialog.kt scripts/apply_save_semantics_fix.py .github/workflows/adjust-save-semantics.yml .github/workflows/temp-save-fix.yml
          git commit -m "Refine editor and external save behavior"
          git push origin Draft
