name: Android CI/CD

on:
  push:
    branches: [Draft, Editor, Optimization, fix/editor-viewport-restore-timing]
  pull_request:
    branches: [Draft, Editor, Optimization]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate Wrapper
        run: |
          [ -f gradlew ] || gradle wrapper
          chmod +x gradlew
      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore; fi
          if [ ! -f debug.keystore ]; then keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'; fi
      - name: Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo 'KEYSTORE_BASE64 secret is missing'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xboard-release.jks"
      - name: Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/xboard-release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ClipNest-release-validation-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  debug-trace:
    name: Debug APK with Editor Trace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate Wrapper
        run: |
          [ -f gradlew ] || gradle wrapper
          chmod +x gradlew
      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore; fi
          if [ ! -f debug.keystore ]; then keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'; fi
      - name: Inject Editor Trace
        run: |
          mkdir -p app/src/main/java/com/clipnest/debug
          cat > app/src/main/java/com/clipnest/debug/EditorStartupTrace.kt <<'EOF'
          package com.clipnest.debug
          import android.app.Dialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.graphics.Typeface
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import com.clipnest.ui.editor.NativeEditorView
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          internal object EditorStartupTrace {
              private val lines = ArrayDeque<String>()
              private val fmt = SimpleDateFormat("HH:mm:ss.SSS", Locale.US)
              @Synchronized fun log(v: NativeEditorView, e: String) {
                  lines.addLast("${fmt.format(Date())} | $e | scroll=${v.scrollY} | sel=${v.selectionStart}..${v.selectionEnd} | text=${v.length()} | view=${v.width}x${v.height} | layout=${v.layout?.height ?: 0} | range=${v.computeVerticalScrollRange()} | extent=${v.computeVerticalScrollExtent()}")
                  while (lines.size > 800) lines.removeFirst()
                  android.util.Log.d("ClipNest.EditorTrace", lines.last())
              }
              @Synchronized fun clear() = lines.clear()
              @Synchronized fun snapshot() = lines.joinToString("\n")
              fun showDialog(context: Context) {
                  val d = Dialog(context)
                  val root = LinearLayout(context).apply { orientation = LinearLayout.VERTICAL; setPadding(24, 20, 24, 12) }
                  root.addView(TextView(context).apply { text = "Editor startup trace"; textSize = 20f; typeface = Typeface.DEFAULT_BOLD })
                  val body = TextView(context).apply { text = snapshot().ifBlank { "No trace events captured." }; textSize = 12f; typeface = Typeface.MONOSPACE; setTextIsSelectable(true) }
                  root.addView(ScrollView(context).apply { addView(body, ViewGroup.LayoutParams(-1, -2)) }, LinearLayout.LayoutParams(-1, 0, 1f))
                  val row = LinearLayout(context)
                  row.addView(Button(context).apply { text = "Clear"; setOnClickListener { clear(); body.text = "No trace events captured." } }, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(Button(context).apply { text = "Copy"; setOnClickListener { (context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("Editor startup trace", snapshot())) } }, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(Button(context).apply { text = "Close"; setOnClickListener { d.dismiss() } }, LinearLayout.LayoutParams(0, -2, 1f))
                  root.addView(row)
                  d.setContentView(root)
                  d.show()
                  d.window?.setLayout(-1, -1)
              }
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/clipnest/ui/editor/NativeEditorView.kt'); s=p.read_text()
          def once(pattern,repl):
              global s
              s,n=re.subn(pattern,repl,s,count=1,flags=re.M)
              if n!=1: raise SystemExit('editor patch failed: '+pattern)
          once(r'(        setCursorVisible\(true\)\n)', r'\1        com.clipnest.debug.EditorStartupTrace.log(this, "init")\n')
          once(r'(override fun onLayout\([^\n]+\) \{\n        super\.onLayout[^\n]+\n        updateStableScrollBounds\(\)\n        restorePendingScrollIfReady\(\)\n)', r'\1\n        com.clipnest.debug.EditorStartupTrace.log(this, "onLayout")')
          once(r'(override fun onSizeChanged\([^\n]+\) \{\n        super\.onSizeChanged[^\n]+\n        updateStableScrollBounds\(\)\n)', r'\1        com.clipnest.debug.EditorStartupTrace.log(this, "onSizeChanged")\n')
          once(r'(override fun onWindowFocusChanged\([^\n]+\) \{\n        super\.onWindowFocusChanged[^\n]+\n        if \(!hasWindowFocus\) saveCurrentScrollPosition\(\)\n)', r'\1        com.clipnest.debug.EditorStartupTrace.log(this, "windowFocus=$hasWindowFocus")\n')
          once(r'(override fun onWindowVisibilityChanged\([^\n]+\) \{\n        super\.onWindowVisibilityChanged[^\n]+\n        if \(visibility != View\.VISIBLE\) saveCurrentScrollPosition\(\)\n)', r'\1        com.clipnest.debug.EditorStartupTrace.log(this, "windowVisibility=$visibility")\n')
          once(r'(override fun onSelectionChanged\([^\n]+\) \{\n        super\.onSelectionChanged[^\n]+\n        invalidate\(\)\n)', r'\1        com.clipnest.debug.EditorStartupTrace.log(this, "selectionChanged")\n')
          once(r'(override fun onDraw\(canvas: Canvas\) \{)', 'override fun onScrollChanged(l: Int, t: Int, oldl: Int, oldt: Int) {\n        super.onScrollChanged(l, t, oldl, oldt)\n        if (t != oldt) com.clipnest.debug.EditorStartupTrace.log(this, "scroll $oldt->$t")\n    }\n\n    override fun setText(text: CharSequence?, type: BufferType?) {\n        com.clipnest.debug.EditorStartupTrace.log(this, "setText before=${text?.length ?: 0}")\n        super.setText(text, type)\n        com.clipnest.debug.EditorStartupTrace.log(this, "setText after")\n    }\n\n    \1')
          p.write_text(s)
          p=Path('app/src/main/java/com/clipnest/ui/settings/SettingsScreen.kt'); s=p.read_text()
          anchor='''        item {\n            SettingsSectionHeader(title = stringResource(com.clipnest.R.string.privacy_security), icon = Icons.Default.Security)\n'''
          if s.count(anchor)!=1: raise SystemExit('settings anchor mismatch')
          block='''        item {\n            SettingsSectionHeader(title = "Debug / Diagnostics", icon = Icons.Default.Security)\n            OutlinedCard(shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {\n                Column(modifier = Modifier.padding(16.dp)) {\n                    Text("Editor startup trace", style = MaterialTheme.typography.bodyLarge.copy(fontWeight = FontWeight.Medium))\n                    Text("Capture editor lifecycle, layout, selection and scroll events.", style = MaterialTheme.typography.bodySmall.copy(color = MaterialTheme.colorScheme.onSurfaceVariant))\n                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {\n                        TextButton(onClick = { com.clipnest.debug.EditorStartupTrace.showDialog(context) }, modifier = Modifier.testTag("settings_editor_trace_button")) { Text("View Log") }\n                        TextButton(onClick = { com.clipnest.debug.EditorStartupTrace.clear() }) { Text("Clear") }\n                    }\n                }\n            }\n        }\n\n'''
          p.write_text(s.replace(anchor,block+anchor,1))
          PY
      - name: Build Debug APK with Editor Trace
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ClipNest-debug-editor-trace-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
