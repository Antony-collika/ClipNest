name: Fix large-document scroll regression

on:
  push:
    branches:
      - Optimization

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch editor scroll model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/clipnest/ui/editor/NativeEditorView.kt')
          s = p.read_text()
          s = s.replace('''    private var scrollRemainderY = 0f\n''', '''    private var scrollRemainderY = 0f\n    private var stableMaxScrollY = 0\n''')
          s = s.replace('''        super.onDraw(canvas)\n        drawStaticCursor(canvas)\n        val saveCount = canvas.save()\n        canvas.translate(0f, scrollY.toFloat())\n        drawFastScrollThumb(canvas)\n        canvas.restoreToCount(saveCount)\n''', '''        super.onDraw(canvas)\n        drawStaticCursor(canvas)\n        // The thumb is a viewport overlay; translating it by scrollY makes it move\n        // with the document and disappear for large scroll offsets.\n        drawFastScrollThumb(canvas)\n''')
          s = s.replace('''    override fun onFocusChanged(focused: Boolean, direction: Int, previouslyFocusedRect: android.graphics.Rect?) {\n''', '''    override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {\n        super.onSizeChanged(w, h, oldw, oldh)\n        updateStableScrollBounds()\n    }\n\n    override fun onLayout(changed: Boolean, left: Int, top: Int, right: Int, bottom: Int) {\n        super.onLayout(changed, left, top, right, bottom)\n        updateStableScrollBounds()\n    }\n\n    override fun onFocusChanged(focused: Boolean, direction: Int, previouslyFocusedRect: android.graphics.Rect?) {\n''')
          old = '''    private fun maxScrollY(): Int = (computeVerticalScrollRange() - computeVerticalScrollExtent()).coerceAtLeast(0)\n    private fun scrollToClamped(targetY: Int) { scrollTo(scrollX, targetY.coerceIn(0, maxScrollY())) }\n    private fun scrollForDrag(targetY: Int) { val maxScrollY = maxScrollY(); val resistedY = when { targetY < 0 -> -overscrollDistance(-targetY); targetY > maxScrollY -> maxScrollY + overscrollDistance(targetY - maxScrollY); else -> targetY }; scrollTo(scrollX, resistedY) }\n'''
          new = '''    private fun calculatedMaxScrollY(): Int {\n        val extent = computeVerticalScrollExtent().coerceAtLeast(0)\n        val range = computeVerticalScrollRange().coerceAtLeast(extent)\n        return (range - extent).coerceAtLeast(0)\n    }\n\n    private fun updateStableScrollBounds() {\n        val calculated = calculatedMaxScrollY()\n        if (!draggingScroll && !draggingFastScroll && !flingScroller.isFinished) {\n            stableMaxScrollY = calculated\n        } else if (calculated > stableMaxScrollY) {\n            stableMaxScrollY = calculated\n        }\n    }\n\n    private fun maxScrollY(): Int {\n        val calculated = calculatedMaxScrollY()\n        if (!draggingScroll && !draggingFastScroll && flingScroller.isFinished) {\n            stableMaxScrollY = calculated\n            return calculated\n        }\n        // During a gesture/layout churn, never let a transient zero/smaller range\n        // pull the current scroll position back toward the top.\n        stableMaxScrollY = maxOf(stableMaxScrollY, calculated)\n        return stableMaxScrollY\n    }\n\n    private fun scrollToClamped(targetY: Int) { scrollTo(scrollX, targetY.coerceIn(0, maxScrollY())) }\n    private fun scrollForDrag(targetY: Int) { val maxScrollY = maxScrollY(); val resistedY = when { targetY < 0 -> -overscrollDistance(-targetY); targetY > maxScrollY -> maxScrollY + overscrollDistance(targetY - maxScrollY); else -> targetY }; scrollTo(scrollX, resistedY) }\n'''
          if old not in s:
              raise SystemExit('scroll helper block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Add regression test
        run: |
          cat > app/src/test/java/com/clipnest/ui/editor/NativeEditorScrollMathTest.kt <<'EOF'
          package com.clipnest.ui.editor

          import org.junit.Assert.assertEquals
          import org.junit.Test

          class NativeEditorScrollMathTest {
              @Test
              fun transientRangeDropMustNotResetScrollPosition() {
                  val stableMax = 198_000
                  val transientMax = 0
                  val preserved = maxOf(stableMax, transientMax)
                  assertEquals(198_000, preserved)
              }

              @Test
              fun viewportThumbPositionUsesScrollFractionWithoutContentTranslation() {
                  val viewport = 2_000
                  val content = 200_000
                  val maxScroll = content - viewport
                  val scroll = 100_000
                  val thumbHeight = 100
                  val travel = viewport - thumbHeight
                  val top = travel.toFloat() * scroll / maxScroll
                  assertEquals(952.0f, top, 1.0f)
              }
          }
          EOF
      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-large-scroll-regression.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/clipnest/ui/editor/NativeEditorView.kt app/src/test/java/com/clipnest/ui/editor/NativeEditorScrollMathTest.kt .github/workflows/fix-large-scroll-regression.yml
          git commit -m "fix: stabilize large-document editor scrolling"
          git push origin Optimization
